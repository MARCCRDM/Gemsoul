// A kaiju alone, framed as KaijuRoll's card window frames it (transparent background).
window.portrait = async (o) => {
  const r2 = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
  r2.setPixelRatio(1); r2.setSize(o.w, o.h); r2.setClearColor(0x000000, 0);

  const key = new THREE.DirectionalLight(new THREE.Color().setRGB(1, 246 / 255, 232 / 255, THREE.SRGBColorSpace), 2.4);
  key.position.set(0.5, 0.8, -0.7); sc.add(key);
